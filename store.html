<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>스토어 - 우리 학교 탄소 다이어트</title>
    <style>
        :root {
            --primary-green: #76c859;
            --water-blue: #4fc3f7;
            --bg-light: #f7f9fc;
        }

        body { 
            margin: 0; padding: 0;
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            background: #fff;
            overflow-x: hidden;
        }

        /* --- 상단 고정 헤더 --- */
        .store-header {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; box-sizing: border-box; z-index: 1001;
        }

        .reward-badge {
            background: #f0faff; padding: 8px 15px; border-radius: 20px;
            font-weight: bold; color: var(--water-blue); font-size: 16px;
        }

        /* --- 카테고리 탭 --- */
        .category-nav {
            position: fixed; top: 60px; width: 100%; height: 50px;
            background: white; display: flex; border-bottom: 1px solid #eee; z-index: 1000;
        }

        .cat-btn {
            flex: 1; border: none; background: none; font-size: 15px;
            font-weight: bold; color: #bbb; cursor: pointer;
        }

        .cat-btn.active { color: var(--primary-green); border-bottom: 3px solid var(--primary-green); }

        /* --- 컨텐츠 영역 --- */
        .store-content { padding: 120px 20px 100px 20px; }

        .section-title { font-size: 18px; font-weight: bold; margin: 25px 0 15px 0; }

        /* --- [NEW] 테마 큰 카드 스타일 (레퍼런스 반영) --- */
        .theme-card {
            background: #ffffff;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border: 1px solid #f0f0f0;
        }

        .theme-banner {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg, #e0f2ff 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .theme-banner-img {
            width: 140px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.1));
        }

        .theme-info { padding: 20px; }

        .theme-title-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .theme-title { font-size: 19px; font-weight: bold; color: #333; }

        .theme-count {
            background: #f0f0f0;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 13px;
            color: #666;
            font-weight: bold;
        }

        /* 테마 내부 아이템 리스트 */
        .theme-item-list {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4열 배치 */
            gap: 10px;
        }

        .small-item-box {
            aspect-ratio: 1/1;
            background: #f9f9f9;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            border: 1px solid #f0f0f0;
        }

        /* --- 가구 그리드 (기존 스타일 유지) --- */
        .item-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
        }

        .item-card {
            background: #f9f9f9; border-radius: 15px; padding: 15px; text-align: center;
        }

        .item-img-placeholder {
            width: 100%; aspect-ratio: 1/1; background: #eee; border-radius: 10px; 
            margin-bottom: 10px; display: flex; justify-content: center; align-items: center; font-size: 40px;
        }

        /* --- 하단 네비게이션 --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 85px; 
            background: white; display: flex; border-top: 1px solid #eee; 
            padding-bottom: env(safe-area-inset-bottom); z-index: 1000;
        }

        .nav-item { flex: 1; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; font-size: 13px; }
        .nav-item.active { color: var(--primary-green); font-weight: bold; }
        .nav-icon { font-size: 28px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <header class="store-header">
        <div class="reward-badge">💧 1,250</div>
        <div style="font-size: 22px; display: flex; gap: 15px;"><span>🪑</span><span>👕</span></div>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active" onclick="scrollToSection('deco-section', this)">꾸미기</button>
        <button class="cat-btn" onclick="scrollToSection('closet-section', this)">옷장</button>
        <button class="cat-btn" onclick="scrollToSection('charge-section', this)">충전소</button>
    </nav>

    <main class="store-content">
        <div id="deco-section">
            <h2 class="section-title">가구</h2>
            <div class="item-grid">
                <div class="item-card"><div class="item-img-placeholder">🪑</div><span style="font-size:14px; font-weight:bold;">나무 의자</span><br><span style="color:var(--water-blue); font-size:13px;">💧 200</span></div>
                <div class="item-card"><div class="item-img-placeholder">🪴</div><span style="font-size:14px; font-weight:bold;">작은 화분</span><br><span style="color:var(--water-blue); font-size:13px;">💧 150</span></div>
            </div>

            <h2 class="section-title">인테리어 테마</h2>
            
            <div class="theme-card">
                <div class="theme-banner">
                    <img src="image_496c1f.png" alt="테마 완성샷" class="theme-banner-img">
                </div>
                <div class="theme-info">
                    <div class="theme-title-row">
                        <span class="theme-title">몽글몽글 구름 위 세상</span>
                        <span class="theme-count">2 / 8</span>
                    </div>
                    
                    <div class="theme-item-list">
                        <div class="small-item-box">☁️</div>
                        <div class="small-item-box">🌈</div>
                        <div class="small-item-box" style="opacity: 0.3;">⭐</div> <div class="small-item-box" style="opacity: 0.3;">🌙</div>
                        <div class="small-item-box" style="opacity: 0.3;">🎈</div>
                        <div class="small-item-box" style="opacity: 0.3;">🧚</div>
                        <div class="small-item-box" style="opacity: 0.3;">🍭</div>
                        <div class="small-item-box" style="opacity: 0.3;">✨</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="closet-section">
            <h2 class="section-title">옷장</h2>
            <div class="item-grid">
                <div class="item-card"><div class="item-img-placeholder">👕</div><span style="font-size:14px; font-weight:bold;">초록 티셔츠</span><br><span style="color:var(--water-blue); font-size:13px;">💧 400</span></div>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
        <a href="quest.html" class="nav-item"><span class="nav-icon">📜</span><span>퀘스트</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">🏆</span><span>랭킹</span></a>
        <a href="store.html" class="nav-item active"><span class="nav-icon">🛒</span><span>스토어</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span><span>내 정보</span></a>
    </nav>

    <script>
        function scrollToSection(sectionId, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const section = document.getElementById(sectionId);
            window.scrollTo({ top: section.offsetTop - 110, behavior: "smooth" });
        }
    </script>
</body>
</html>
