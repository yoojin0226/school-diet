<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>스토어 - 우리 학교 탄소 다이어트</title>
    <style>
        :root {
            --primary-green: #76c859;
            --water-blue: #4fc3f7;
            --text-main: #333;
            --text-sub: #999;
        }

        body { 
            margin: 0; padding: 0;
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            background: #fff;
        }

        /* --- 상단 고정 헤더 --- */
        .store-header {
            position: fixed; top: 0; width: 100%; height: 60px;
            background: white; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; box-sizing: border-box; z-index: 1001;
        }
        .reward-badge { background: #f0faff; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: var(--water-blue); font-size: 16px; }

        .category-nav {
            position: fixed; top: 60px; width: 100%; height: 50px;
            background: white; display: flex; border-bottom: 1px solid #eee; z-index: 1000;
        }
        .cat-btn { flex: 1; border: none; background: none; font-size: 15px; font-weight: bold; color: #bbb; }
        .cat-btn.active { color: var(--primary-green); border-bottom: 3px solid var(--primary-green); }

        /* --- 컨텐츠 영역 --- */
        .store-content { padding: 130px 15px 100px 15px; }

        /* --- 테마 그리드 레이아웃 (2열) --- */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 15px;
        }

        /* --- 개별 테마 카드 구성 --- */
        .theme-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* 1. 이미지 영역 (중앙) */
        .img-container {
            width: 100%;
            aspect-ratio: 1/1;
            background: #f8f9fa;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }
        .img-container img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        /* 2. 주제 제목 (그림 밑) */
        .theme-title {
            font-size: 14px;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 8px;
            white-space: nowrap;
        }

        /* 3. 아이템 현황 (모서리가 아주 둥근 사각형) */
        .status-pill {
            background: #f2f2f2;
            color: #888;
            font-size: 11px;
            font-weight: 800;
            padding: 4px 14px;
            border-radius: 20px; /* 완전한 둥근 모양 */
            display: inline-block;
        }

        /* --- 하단 네비게이션 --- */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; 
            background: white; display: flex; border-top: 1px solid #eee; 
            padding-bottom: env(safe-area-inset-bottom); z-index: 1000;
        }
        .nav-item { flex: 1; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; font-size: 12px; }
        .nav-item.active { color: var(--primary-green); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <header class="store-header">
        <div class="reward-badge">💧 1,250</div>
        <div style="font-size: 20px; display: flex; gap: 12px;"><span>🪑</span><span>👕</span></div>
    </header>

    <nav class="category-nav">
        <button class="cat-btn active">꾸미기</button>
        <button class="cat-btn">옷장</button>
        <button class="cat-btn">충전소</button>
    </nav>

    <main class="store-content">
        <div class="theme-grid">
            
            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22cdaf.png" alt="몽글몽글 구름 위 세상">
                </div>
                <div class="theme-title">몽글몽글 구름 위 세상</div>
                <div class="status-pill">0 / 6</div>
            </div>

            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22cd32.png" alt="친환경 자전거 여행">
                </div>
                <div class="theme-title">친환경 자전거 여행</div>
                <div class="status-pill">0 / 6</div>
            </div>

            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22ccf1.png" alt="별이 빛나는 밤">
                </div>
                <div class="theme-title">별이 빛나는 밤</div>
                <div class="status-pill">0 / 6</div>
            </div>

            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22cc99.png" alt="오늘의 실천 상자">
                </div>
                <div class="theme-title">오늘의 실천 상자</div>
                <div class="status-pill">0 / 6</div>
            </div>

            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22c9ce.png" alt="마음의 연못">
                </div>
                <div class="theme-title">마음의 연못</div>
                <div class="status-pill">0 / 6</div>
            </div>

            <div class="theme-card">
                <div class="img-container">
                    <img src="image_22c98d.png" alt="기후의 문">
                </div>
                <div class="theme-title">기후의 문</div>
                <div class="status-pill">0 / 6</div>
            </div>

        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
        <a href="quest.html" class="nav-item"><span class="nav-icon">📜</span><span>퀘스트</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">🏆</span><span>랭킹</span></a>
        <a href="store.html" class="nav-item active"><span class="nav-icon">🛒</span><span>스토어</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span><span>내 정보</span></a>
    </nav>

</body>
</html>
