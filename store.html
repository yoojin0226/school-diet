<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>스토어 - 우리 학교 탄소 다이어트</title>
    <style>
        :root {
            --primary-green: #76c859;
            --water-blue: #4fc3f7;
            --text-main: #333;
            --bg-light: #f8f9fa;
        }

        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; background: #fff; scroll-behavior: smooth; }

        /* --- 상단 헤더 & 카테고리 --- */
        .header-fixed { position: fixed; top: 0; width: 100%; background: white; z-index: 1001; border-bottom: 1px solid #eee; }
        .store-header { height: 60px; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .reward-badge { background: #f0faff; padding: 8px 15px; border-radius: 20px; font-weight: bold; color: var(--water-blue); font-size: 16px; }
        .category-nav { height: 50px; display: flex; }
        .cat-btn { flex: 1; border: none; background: none; font-size: 15px; font-weight: bold; color: #bbb; cursor: pointer; position: relative; }
        .cat-btn.active { color: var(--primary-green); }
        .cat-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20%; width: 60%; height: 3px; background: var(--primary-green); border-radius: 2px; }

        /* --- 컨텐츠 영역 --- */
        .store-content { padding: 120px 15px 100px 15px; }
        .section-container { margin-bottom: 50px; }
        .section-main-title { font-size: 20px; font-weight: bold; margin: 30px 0 20px 5px; }
        .sub-title { font-size: 16px; font-weight: bold; margin: 20px 0 15px 5px; color: #666; }

        /* --- 인테리어 테마 그리드 --- */
        .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 15px; }
        .theme-card { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
        .img-container { width: 100%; aspect-ratio: 1/1; background: #f8f9fa; border-radius: 20px; display: flex; justify-content: center; align-items: center; overflow: hidden; margin-bottom: 10px; border: 1px solid #eee; }
        .img-container img { width: 90%; height: 90%; object-fit: contain; }
        .theme-title { font-size: 14px; font-weight: bold; margin-bottom: 8px; }
        .status-pill { background: #f2f2f2; color: #888; font-size: 11px; font-weight: 800; padding: 4px 14px; border-radius: 20px; }

        /* --- [NEW] 테마 상세 오버레이 페이지 --- */
        #theme-detail-page {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 2000; display: none; overflow-y: auto;
            padding-bottom: 50px;
        }
        .detail-header { position: sticky; top: 0; background: white; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #eee; z-index: 10; }
        .back-btn { border: none; background: none; font-size: 24px; cursor: pointer; }
        
        .preview-banner { width: 100%; height: 220px; background: #f0faff; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        .preview-banner img { width: 100%; height: 100%; object-fit: cover; } /* 예시 사진 */

        .detail-item-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; }
        .buy-card { background: #fff; border: 1px solid #eee; border-radius: 20px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .buy-img { width: 100%; aspect-ratio: 1/1; background: #fcfcfc; border-radius: 15px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .buy-img img { width: 80%; }
        .buy-name { font-size: 14px; font-weight: bold; margin-bottom: 5px; display: block; }
        .buy-price { color: var(--water-blue); font-weight: bold; font-size: 13px; background: #f0faff; padding: 4px 10px; border-radius: 10px; }

        /* --- 하단 네비 --- */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 85px; background: white; display: flex; border-top: 1px solid #eee; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-item { flex: 1; text-decoration: none; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #bbb; font-size: 12px; }
        .nav-item.active { color: var(--primary-green); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header-fixed">
        <header class="store-header">
            <div class="reward-badge">💧 1,250</div>
            <div style="font-size: 20px; display: flex; gap: 12px;"><span>🪑</span><span>👕</span></div>
        </header>
        <nav class="category-nav">
            <button class="cat-btn active" onclick="tabScroll('deco-sec', this)">꾸미기</button>
            <button class="cat-btn" onclick="tabScroll('closet-sec', this)">옷장</button>
            <button class="cat-btn" onclick="tabScroll('charge-sec', this)">충전소</button>
        </nav>
    </div>

    <main class="store-content">
        <section id="deco-sec" class="section-container">
            <h1 class="section-main-title">꾸미기</h1>
            <h2 class="sub-title">인테리어 테마</h2>
            <div class="theme-grid">
                <div class="theme-card" onclick="openThemeDetail()">
                    <div class="img-container"><img src="image_111c1f.png"></div>
                    <div class="theme-title">몽글몽글 구름 위 세상</div>
                    <div class="status-pill">0 / 10</div>
                </div>
                </div>
        </section>
    </main>

    <div id="theme-detail-page">
        <div class="detail-header">
            <button class="back-btn" onclick="closeThemeDetail()">←</button>
            <span style="font-weight: bold; font-size: 18px;">몽글몽글 구름 위 세상</span>
        </div>
        
        <div class="preview-banner">
            <img src="image_d12b7b.jpg" alt="완성 예시">
        </div>

        <div style="padding: 20px 20px 0 20px; font-weight: bold; color: #333;">테마 구성 아이템</div>

        <div class="detail-item-grid">
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">별</span><span class="buy-price">💧 200</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">작은 구름 요정</span><span class="buy-price">💧 350</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">새</span><span class="buy-price">💧 150</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">행성</span><span class="buy-price">💧 400</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">씨앗</span><span class="buy-price">💧 50</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">새싹</span><span class="buy-price">💧 80</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">구름</span><span class="buy-price">💧 180</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">작은 구름</span><span class="buy-price">💧 100</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">팻말</span><span class="buy-price">💧 120</span></div>
            <div class="buy-card"><div class="buy-img"><img src="image_122c1f.png"></div><span class="buy-name">돌</span><span class="buy-price">💧 60</span></div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span><span>홈</span></a>
        <a href="quest.html" class="nav-item"><span class="nav-icon">📜</span><span>퀘스트</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">🏆</span><span>랭킹</span></a>
        <a href="store.html" class="nav-item active"><span class="nav-icon">🛒</span><span>스토어</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span><span>내 정보</span></a>
    </nav>

    <script>
        function openThemeDetail() { document.getElementById('theme-detail-page').style.display = 'block'; }
        function closeThemeDetail() { document.getElementById('theme-detail-page').style.display = 'none'; }
        
        function tabScroll(id, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const target = document.getElementById(id);
            const targetPos = target.getBoundingClientRect().top + window.pageYOffset - 110;
            window.scrollTo({ top: targetPos, behavior: 'smooth' });
        }
    </script>
</body>
</html>
