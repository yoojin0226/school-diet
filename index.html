<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>홈 - 우리 학교 탄소 다이어트</title>
    <style>
        :root {
            --primary-green: #76c859;
            --water-blue: #4fc3f7;
        }

        body { 
            margin: 0; padding: 0;
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            overflow: hidden; 
            background: linear-gradient(to bottom, #ffffff, #c2e9fb);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            justify-content: flex-end;
            padding-bottom: 85px; /* 하단 네비게이션 높이 */
            box-sizing: border-box;
        }

        /* --- 상단 헤더 --- */
        .main-header { 
            position: absolute; top: 0; width: 100%; 
            display: flex; justify-content: space-between; 
            padding: 20px; box-sizing: border-box; z-index: 100; 
        }

        .top-ranking { 
            position: absolute; top: 80px; width: 100%; 
            text-align: center; font-weight: bold; font-size: 22px; 
        }

        /* --- 캐릭터 영역 --- */
        .character-wrapper { 
            width: 320px; 
            perspective: 1000px; 
            margin: 0 auto 40px auto; 
            cursor: grab; 
            touch-action: none;
        }

        .main-character { 
            width: 100%; 
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.1)); 
            transition: transform 0.1s; 
            pointer-events: none;
        }

        /* --- 질문 박스 --- */
        .quiz-box { 
            background: white; 
            width: 90%; 
            max-width: 500px;
            padding: 25px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.08); 
            text-align: center; 
            margin: 0 auto 20px auto; 
        }

        /* --- 하단 네비게이션 --- */
        .bottom-nav { 
            position: fixed; bottom: 0; width: 100%; height: 85px; 
            background: white; display: flex; border-top: 1px solid #eee; 
            padding-bottom: env(safe-area-inset-bottom); z-index: 1000;
        }

        .nav-item { 
            flex: 1; border: none; background: none; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            color: #bbb; cursor: pointer; font-size: 13px; text-decoration: none;
        }

        .nav-item.active { color: var(--primary-green); font-weight: bold; }
        .nav-icon { font-size: 28px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="app">
        <header class="main-header">
            <div style="background:rgba(255,255,255,0.85); padding:10px 18px; border-radius:25px; font-weight:bold; color:var(--water-blue); font-size: 18px;">💧 1,250</div>
            <div style="display:flex; gap:15px; font-size:24px;"><span>📤</span><span>🔔</span></div>
        </header>
        
        <div class="top-ranking">우리 학교 순위 <span style="color:var(--primary-green)">15</span>위 째</div>
        
        <div class="character-wrapper" id="rotate-container">
            <img src="image_496c1f.png" alt="캐릭터" id="sprout-img" class="main-character">
        </div>

        <div class="quiz-box">
            <div style="color:var(--primary-green); font-size:14px; margin-bottom:10px; font-weight:bold;">오늘의 기후 행동 질문</div>
            <div style="font-size: 17px; line-height: 1.5;">"가까운 거리는 걷거나 자전거를 이용해볼까요?"</div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span>홈</span></a>
        <a href="quest.html" class="nav-item"><span class="nav-icon">📜</span><span>퀘스트</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">🏆</span><span>랭킹</span></a>
        <a href="store.html" class="nav-item"><span class="nav-icon">🛒</span><span>스토어</span></a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span><span>내 정보</span></a>
    </nav>

    <script>
        const container = document.getElementById('rotate-container');
        const img = document.getElementById('sprout-img');
        let isDragging = false, startX, currentRotation = 0;

        container.addEventListener('touchstart', (e) => { isDragging = true; startX = e.touches[0].pageX; });
        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let walk = (e.touches[0].pageX - startX) * 0.7;
            img.style.transform = `rotateY(${currentRotation + walk}deg)`;
        });
        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            currentRotation += (e.changedTouches[0].pageX - startX) * 0.7;
        });
    </script>
</body>
</html>
