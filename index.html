<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리 학교 탄소 다이어트 챌린지</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="deco-layer">
            <div class="cloud cloud-1">☁️</div>
            <div class="cloud cloud-2">☁️</div>
            <div class="butterfly">🦋</div>
        </div>

        <header class="main-header">
            <div class="asset-badge">🪨 250</div>
            <button class="btn_settings">⚙️</button>
        </header>

        <main class="main-scene">
            <div class="ranking-card">
                <p>우리 학교는 지금</p>
                <h3>경기 지역 <span class="highlight">15위</span></h3>
            </div>

            <div class="character-container" onclick="playClickEffect(event)">
                <img src="image_469c1f.jpg" alt="메인 캐릭터" class="main-character">
                <div class="character-shadow"></div>
                
                <div id="effect-container"></div>
            </div>

            <div class="growth-box">
                <div class="level-badge">Lv.1 아기새싹</div>
                <div class="progress-bar"><div class="fill" style="width: 40%;"></div></div>
            </div>

            <div class="quick-msg">"오늘 분리배출 퀘스트를 완료해볼까요?"</div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active">🌱<span>홈</span></button>
            <button class="nav-item">📜<span>퀘스트</span></button>
            <button class="nav-item">🏆<span>랭킹</span></button>
            <button class="nav-item">🛒<span>스토어</span></button>
            <button class="nav-item">👤<span>내 정보</span></button>
        </nav>
    </div>
    <script src="main.js"></script>
</body>
</html>
