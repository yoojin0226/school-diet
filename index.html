<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리 학교 탄소 다이어트 챌린지</title>
    <style>
        :root {
            --primary-green: #76c859;
            --water-blue: #4fc3f7;
            --bg-gradient: linear-gradient(to bottom, #ffffff, #c2e9fb);
        }

        body { 
            margin: 0; 
            background: var(--bg-blue); 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            overflow: hidden; 
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: relative;
            background: var(--bg-gradient);
        }

        /* --- 상단 헤더: 물 토큰 및 기능 아이콘 --- */
        .main-header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .water-token-badge {
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 15px;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--water-blue);
        }

        .header-right-icons {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .btn_icon {
            background: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 18px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pet-mini-profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid white;
            overflow: hidden;
            background: #fff;
        }

        /* --- 메인 장면 및 배경 꾸미기 공간 --- */
        .main-scene { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            z-index: 10;
        }

        /* 꾸미기 아이템이 배치될 공간 */
        .decoration-space {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        /* --- 중앙 캐릭터 및 질문/퀴즈 --- */
        .character-container {
            position: relative;
            width: 65%; 
            max-width: 300px;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-character {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
            animation: float 3s ease-in-out infinite;
        }

        /* 오늘의 기후 질문 (말풍선 스타일) */
        .quiz-bubble {
            margin-top: 20px;
            background: white;
            padding: 15px 20px;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            text-align: center;
            width: 85%;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .quiz-bubble::after {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 10px solid white;
        }

        .quiz-tag {
            display: block;
            color: var(--primary-green);
            font-weight: bold;
            font-size: 11px;
            margin-bottom: 5px;
        }

        /* --- 하단 네비게이션 --- */
        .bottom-nav { 
            height: 75px; 
            background: white; 
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid #eee; 
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 100;
        }

        .nav-item { border: none; background: none; display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #bbb; cursor: pointer; }
        .nav-item.active { color: var(--primary-green); font-weight: bold; }
        .nav-icon { font-size: 24px; margin-bottom: 4px; }

        /* 애니메이션 */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .effect-item {
            position: absolute;
            pointer-events: none;
            font-size: 30px;
            animation: popUp 0.8s ease-out forwards;
            z-index: 200;
        }

        @keyframes popUp {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
            100% { transform: translate(-50%, -180%) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="decoration-space" id="deco-space">
            </div>

        <header class="main-header">
            <div class="water-token-badge">
                <span class="icon">💧</span>
                <span id="water-count">1,250</span>
            </div>
            
            <div class="header-right-icons">
                <button class="btn_icon">📤</button>
                <button class="btn_icon">🔔</button>
                <div class="pet-mini-profile">
                    <img src="image_496c1f.png" alt="My Pet" style="width:100%; height:100%; object-fit:cover;">
                </div>
            </div>
        </header>

        <main class="main-scene">
            <div class="character-container" id="character-zone">
                <img src="image_496c1f.png" alt="메인 캐릭터" class="main-character">
                
                <div class="quiz-bubble">
                    <span class="quiz-tag">오늘의 기후 퀴즈</span>
                    <span id="quiz-text">"양치할 때 컵을 사용하면 물을 얼마나 아낄 수 있을까요?"</span>
                </div>

                <div id="effect-container" style="position: absolute; width: 100%; height: 100%;"></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active"><span class="nav-icon">🌱</span><span>홈</span></button>
            <button class="nav-item"><span class="nav-icon">📜</span><span>퀘스트</span></button>
            <button class="nav-item"><span class="nav-icon">🏆</span><span>랭킹</span></button>
            <button class="nav-item"><span class="nav-icon">🛒</span><span>스토어</span></button>
            <button class="nav-item"><span class="nav-icon">👤</span><span>내 정보</span></button>
        </nav>
    </div>

    <script>
        const charZone = document.getElementById('character-zone');
        const effectContainer = document.getElementById('effect-container');

        // 캐릭터 클릭 시 하트/반짝이 효과
        charZone.addEventListener('click', (e) => {
            const icons = ['❤️', '✨', '💖', '⭐', '💧'];
            
            for(let i=0; i<3; i++) {
                const span = document.createElement('span');
                span.className = 'effect-item';
                span.innerText = icons[Math.floor(Math.random() * icons.length)];
                
                // 클릭 위치 기준 무작위 산출 (보정치 적용)
                const x = e.offsetX;
                const y = e.offsetY;
                
                span.style.left = x + (Math.random() * 40 - 20) + 'px';
                span.style.top = y + (Math.random() * 40 - 20) + 'px';
                
                effectContainer.appendChild(span);
                
                setTimeout(() => span.remove(), 800);
            }
        });

        // 추후 퀴즈 텍스트를 무작위로 변경하는 함수 등을 추가할 수 있습니다.
    </script>
</body>
</html>
